<!doctype html>
<html lang="en-GB">
<head>

<body>
<header class="top">

    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button class="tab" data-tab="trip" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v15H4z M4 9h16 M8 3v4 M16 3v4"/></svg>
    <span>Trip</span>
  </button>
  <button class="tab" data-tab="players">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>
    <span>Players</span>
  </button>
  <button class="tab" data-tab="scores">
    <svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h5"/></svg>
    <span>Scores</span>
  </button>
  <button class="tab" data-tab="standings">
    <svg viewBox="0 0 24 24"><path d="M3 20h18 M6 20v-7h4v7 M14 20V4h4v16"/></svg>
    <span>Standings</span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
